                steps: ["Larutkan Natrosol air hangat", "Campur BKC + parfum, satukan ke Natrosol", "Tambah sisa air & pewarna"],
                footer: "(Resep 111)"
            },
            "Cara Membuat Un-yellowing Midsole Sepatu": {
                bahan: ["Oxalic acid 100 gr", "Baking soda 100 gr", "STPP 50 gr", "Enzim AR 50 gr"],
                steps: ["Campur serbuk (1)", "Campur parfum + NP-10 + air (2)", "Satukan 1 dan 2"],
                footer: "(Resep 112)"
            },
            "Cara Membuat Vanishing Cream Glowing": {
                bahan: ["Stearic 50 gr", "Baking soda 5 gr", "Glycerin 15 cc"],
                steps: ["Lelehkan Stearic", "Campur Baking soda + Glycerin, tuang Stearic", "Tambah air, dinginkan, beri parfum"],
                footer: "(Resep 113)"
            },
            "Cara Membuat Water Coolant Radiator": {
                bahan: ["Propilen glikol 100 ml", "Aquadest 1 L", "Fluorescein 1 gr"],
                steps: ["Propilen glikol + larutan warna", "Aduk rata, saring, kemas"],
                footer: "(Resep 114)"
            }
        };

        // State
        let state = {
            searchTerm: "",
            selectedTitle: ALL_TITLES[0],
            isSidebarOpen: true
        };

        // DOM Elements
        const recipeListEl = document.getElementById('recipe-list');
        const recipeContainerEl = document.getElementById('recipe-container');
        const searchInputEl = document.getElementById('search-input');
        const sidebarToggleBtn = document.getElementById('sidebar-toggle');
        const headerLabelEl = document.getElementById('header-label');

        function renderList() {
            const filtered = ALL_TITLES.filter(t => t.toLowerCase().includes(state.searchTerm.toLowerCase()));
            recipeListEl.innerHTML = '';
            
            if (filtered.length === 0) {
                recipeListEl.innerHTML = `<div class="p-8 text-center text-slate-400 text-sm">Tidak ada hasil ditemukan.</div>`;
                return;
            }

            filtered.forEach(title => {
                const btn = document.createElement('button');
                const isActive = state.selectedTitle === title;
                const hasData = !!RECIPE_DETAILS[title];

                btn.className = `w-full text-left px-4 py-3 text-sm flex items-center justify-between transition-colors
                    ${isActive ? 'bg-indigo-50 text-indigo-700 font-semibold border-r-4 border-indigo-600' : 'text-slate-600 hover:bg-slate-50'}`;
                
                btn.innerHTML = `
                    <span class="truncate pr-2">${title.replace("Cara Membuat ", "")}</span>
                    ${hasData ? '<div class="w-1.5 h-1.5 rounded-full bg-indigo-400 shrink-0"></div>' : ''}
                `;
                
                btn.onclick = () => {
                    state.selectedTitle = title;
                    renderContent();
                    renderList();
                    if (window.innerWidth < 768) {
                        state.isSidebarOpen = false;
                        document.body.classList.add('sidebar-closed');
                    }
                };
                recipeListEl.appendChild(btn);
            });
        }

        function renderContent() {
            const data = RECIPE_DETAILS[state.selectedTitle];
            headerLabelEl.innerText = data ? 'Instruksi Detail' : 'Coming Soon';

            if (!data) {
                recipeContainerEl.innerHTML = `
                    <h2 class="text-3xl md:text-4xl font-extrabold text-slate-900 mb-2 leading-tight">${state.selectedTitle}</h2>
                    <div class="mt-20 flex flex-col items-center justify-center text-center p-10 bg-white rounded-[3rem] shadow-sm border border-slate-100">
                        <div class="w-20 h-20 bg-slate-50 rounded-full flex items-center justify-center mb-6 text-slate-200">
                            <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
                        </div>
                        <h3 class="text-xl font-bold text-slate-700 mb-2">Konten Belum Tersedia</h3>
                        <p class="text-slate-400 text-sm max-w-sm">
                            Resep untuk <span class="font-semibold text-slate-500">"${state.selectedTitle}"</span> sedang dalam tahap penyusunan.
                        </p>
                    </div>
                `;
                return;
            }

            recipeContainerEl.innerHTML = `
                <h2 class="text-3xl md:text-4xl font-extrabold text-slate-900 mb-2 leading-tight">${state.selectedTitle}</h2>
                <div class="space-y-8 mt-6">
                    ${data.subtitle ? `
                        <p class="text-xl text-indigo-600 font-medium italic border-l-4 border-indigo-200 pl-4 py-1">"${data.subtitle}"</p>
                    ` : ''}

                    ${data.warning ? `
                        <div class="flex items-start gap-4 p-4 bg-red-50 border border-red-100 rounded-2xl text-red-700">
                            <svg class="w-5 h-5 shrink-0 mt-0.5" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
                            <div class="text-sm font-semibold">${data.warning}</div>
                        </div>
                    ` : ''}

                    <div class="grid md:grid-cols-2 gap-6">
                        ${data.bahan ? `
                        <section class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
                            <div class="flex items-center gap-2 mb-4 text-indigo-600">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 3h15"></path><path d="M6 3v16a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V3"></path><path d="M6 14h12"></path></svg>
                                <h3 class="font-bold uppercase text-xs tracking-widest">Bahan-Bahan</h3>
                            </div>
                            <ul class="space-y-3">
                                ${data.bahan.map((item, idx) => `
                                    <li class="text-slate-600 text-sm flex gap-3">
                                        <span class="w-5 h-5 bg-indigo-50 rounded-full flex items-center justify-center text-[10px] font-bold text-indigo-600 shrink-0 mt-0.5">${idx + 1}</span>
                                        ${item}
                                    </li>
                                `).join('')}
                            </ul>
                        </section>` : ''}

                        ${data.alat ? `
                        <section class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
                            <div class="flex items-center gap-2 mb-4 text-emerald-600">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.77 3.77z"></path></svg>
                                <h3 class="font-bold uppercase text-xs tracking-widest">Alat</h3>
                            </div>
                            <ul class="space-y-3">
                                ${data.alat.map(item => `
                                    <li class="text-slate-600 text-sm flex items-center gap-3">
                                        <div class="w-1.5 h-1.5 rounded-full bg-emerald-400"></div>
                                        ${item}
                                    </li>
                                `).join('')}
                            </ul>
                        </section>` : ''}
                    </div>

                    ${data.steps ? `
                    <section class="bg-white p-6 md:p-8 rounded-3xl shadow-sm border border-slate-100">
                        <div class="flex items-center gap-2 mb-6 text-slate-800">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><line x1="10" y1="9" x2="8" y2="9"></line></svg>
                            <h3 class="font-bold uppercase text-xs tracking-widest">Langkah Pembuatan</h3>
                        </div>
                        <div class="space-y-6">
                            ${data.steps.map((step, idx) => `
                                <div class="flex gap-4 group">
                                    <div class="relative">
                                        <div class="w-8 h-8 rounded-xl bg-slate-100 text-slate-500 font-bold text-sm flex items-center justify-center group-hover:bg-indigo-600 group-hover:text-white transition-colors">
                                            ${idx + 1}
                                        </div>
                                        ${idx !== data.steps.length - 1 ? '<div class="absolute top-8 left-1/2 -translate-x-1/2 w-0.5 h-full bg-slate-100 mt-2"></div>' : ''}
                                    </div>
                                    <p class="text-slate-600 text-sm md:text-base pt-1 flex-1 leading-relaxed">${step}</p>
                                </div>
                            `).join('')}
                        </div>
                    </section>` : ''}

                    ${(data.note || data.usage || data.benefits) ? `
                        <div class="grid gap-6">
                            ${data.note ? `
                                <div class="bg-amber-50 p-4 rounded-2xl border border-amber-100 flex gap-3 text-amber-800">
                                    <svg class="w-5 h-5 shrink-0" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
                                    <p class="text-sm italic"><span class="font-bold">Catatan:</span> ${data.note}</p>
                                </div>
                            ` : ''}
                            ${data.usage ? `
                                <div class="bg-blue-50 p-5 rounded-2xl border border-blue-100">
                                    <h4 class="font-bold text-blue-800 text-xs uppercase tracking-widest mb-2">Cara Pakai</h4>
                                    <p class="text-sm text-blue-700 leading-relaxed">${data.usage}</p>
                                </div>
                            ` : ''}
                            ${data.benefits ? `
                                <div class="bg-indigo-50 p-5 rounded-2xl border border-indigo-100">
                                    <h4 class="font-bold text-indigo-800 text-xs uppercase tracking-widest mb-2">Manfaat & Kegunaan</h4>
                                    <div class="flex flex-wrap gap-2">
                                        ${data.benefits.map(b => `<span class="px-3 py-1 bg-white rounded-full text-xs font-medium text-indigo-600 shadow-sm">${b}</span>`).join('')}
                                    </div>
                                </div>
                            ` : ''}
                        </div>
                    ` : ''}

                    <div class="text-center py-10 opacity-30 select-none">
                        <div class="h-px bg-slate-300 w-full mb-4"></div>
                        <p class="text-xs font-mono">${data.footer}</p>
                    </div>
                </div>
            `;
        }

        // Event Listeners
        searchInputEl.oninput = (e) => {
            state.searchTerm = e.target.value;
            renderList();
        };

        sidebarToggleBtn.onclick = () => {
            state.isSidebarOpen = !state.isSidebarOpen;
            document.body.classList.toggle('sidebar-closed', !state.isSidebarOpen);
        };

        // Initialize
        renderList();
        renderContent();
    </script>
</body>
</html>
