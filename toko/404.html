<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8" />
    <meta http-equiv="x-ua-compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>404 - Halaman Tidak Ditemukan | Bandar Deterjen</title>
    <meta name="robots" content="noindex, follow" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: #f8fafc;
            color: #1e293b;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
        }
        .error-container {
            max-width: 500px;
            background: white;
            padding: 48px 32px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.08);
            border: 1px solid #e2e8f0;
        }
        .error-icon {
            font-size: 64px;
            margin-bottom: 16px;
            display: block;
        }
        h1 {
            font-size: 28px;
            font-weight: 800;
            color: #1e3a8a;
            margin-bottom: 8px;
        }
        p {
            color: #64748b;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 24px;
        }
        .btn-home {
            display: inline-block;
            background: #1e3a8a;
            color: white;
            font-weight: 700;
            font-size: 14px;
            padding: 12px 32px;
            border-radius: 12px;
            text-decoration: none;
            transition: background 0.2s;
        }
        .btn-home:hover {
            background: #1d4ed8;
        }
        .brand {
            font-weight: 800;
            color: #1e3a8a;
            margin-top: 16px;
            font-size: 13px;
            letter-spacing: 0.5px;
        }
        .brand span {
            color: #f97316;
        }
        .loading-redirect {
            margin-top: 16px;
            font-size: 14px;
            color: #94a3b8;
        }
        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 3px solid #e2e8f0;
            border-top-color: #1e3a8a;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .path-info {
            font-size: 12px;
            color: #94a3b8;
            background: #f1f5f9;
            padding: 8px 12px;
            border-radius: 8px;
            margin-bottom: 16px;
            word-break: break-all;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div class="error-container" id="error-container">
        <span class="error-icon">🔍</span>
        <h1>Halaman Tidak Ditemukan</h1>
        <p>Maaf, halaman yang Anda cari tidak tersedia.<br>Silakan kembali ke beranda atau gunakan menu navigasi.</p>
        <div class="path-info" id="path-display">Memuat...</div>
        <a href="/" class="btn-home" id="home-link">
            🏠 Kembali ke Beranda
        </a>
        <div class="loading-redirect" id="redirect-info">
            <span class="spinner"></span> Mengalihkan ke halaman yang sesuai...
        </div>
        <div class="brand">BANDAR<span>DETERJEN</span></div>
    </div>

    <script>
        (function() {
            // Cek apakah ini adalah redirect loop
            if (sessionStorage.getItem('bandar_deterjen_redirecting')) {
                document.getElementById('redirect-info').innerHTML = 'Gagal mengalihkan. Silakan klik tombol di atas.';
                return;
            }

            // Ambil path yang diminta
            var requestedPath = window.location.pathname + window.location.search;
            
            // Tampilkan path di halaman
            var pathDisplay = document.getElementById('path-display');
            if (pathDisplay) {
                pathDisplay.textContent = 'Path: ' + requestedPath;
            }

            // Hanya redirect jika path bukan root, index.html, atau 404.html
            var shouldRedirect = requestedPath && 
                requestedPath !== '/' && 
                requestedPath !== '/index.html' &&
                requestedPath !== '/404.html' &&
                !requestedPath.includes('favicon.ico') &&
                !requestedPath.includes('robots.txt') &&
                !requestedPath.match(/\.(css|js|jpg|jpeg|png|gif|svg|ico|webp)$/i);

            if (shouldRedirect) {
                try {
                    // Set flag untuk mencegah infinite loop
                    sessionStorage.setItem('bandar_deterjen_redirecting', 'true');
                    sessionStorage.setItem('bandar_deterjen_route', requestedPath);
                    
                    // Redirect ke index.html
                    setTimeout(function() {
                        window.location.replace('/index.html' + requestedPath);
                    }, 800);
                } catch (e) {
                    // Jika sessionStorage error, tetap coba redirect
                    setTimeout(function() {
                        window.location.replace('/index.html' + requestedPath);
                    }, 800);
                }
            } else {
                // Jika path adalah root atau static file, tidak perlu redirect
                document.getElementById('redirect-info').innerHTML = 'Halaman tidak ditemukan.';
                var spinner = document.querySelector('.spinner');
                if (spinner) spinner.style.display = 'none';
            }
        })();
    </script>
</body>
</html>
