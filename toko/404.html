<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8" />
    <meta http-equiv="x-ua-compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>404 - Halaman Tidak Ditemukan | Albandar Detergent</title>
    <meta name="robots" content="noindex, follow" />
    <base href="/toko/" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: #f8fafc;
            color: #1e293b;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
        }
        .error-container {
            max-width: 500px;
            background: white;
            padding: 48px 32px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.08);
            border: 1px solid #e2e8f0;
        }
        .error-icon {
            font-size: 64px;
            margin-bottom: 16px;
            display: block;
        }
        h1 {
            font-size: 28px;
            font-weight: 800;
            color: #1e3a8a;
            margin-bottom: 8px;
        }
        p {
            color: #64748b;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 24px;
        }
        .btn-home {
            display: inline-block;
            background: #1e3a8a;
            color: white;
            font-weight: 700;
            font-size: 14px;
            padding: 12px 32px;
            border-radius: 12px;
            text-decoration: none;
            transition: background 0.2s;
        }
        .btn-home:hover {
            background: #1d4ed8;
        }
        .brand {
            font-weight: 800;
            color: #1e3a8a;
            margin-top: 16px;
            font-size: 13px;
            letter-spacing: 0.5px;
        }
        .brand span {
            color: #f97316;
        }
        .loading-redirect {
            margin-top: 16px;
            font-size: 14px;
            color: #94a3b8;
        }
        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 3px solid #e2e8f0;
            border-top-color: #1e3a8a;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .path-info {
            font-size: 12px;
            color: #94a3b8;
            background: #f1f5f9;
            padding: 8px 12px;
            border-radius: 8px;
            margin-bottom: 16px;
            word-break: break-all;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div class="error-container" id="error-container">
        <span class="error-icon">🔍</span>
        <h1>Halaman Tidak Ditemukan</h1>
        <p>Maaf, halaman yang Anda cari tidak tersedia.<br>Silakan kembali ke beranda atau gunakan menu navigasi.</p>
        <div class="path-info" id="path-display">Memuat...</div>
        <a href="/toko/" class="btn-home" id="home-link">
            🏠 Kembali ke Beranda
        </a>
        <div class="loading-redirect" id="redirect-info">
            <span class="spinner"></span> Mengalihkan ke halaman yang sesuai...
        </div>
        <div class="brand">ALBANDAR<span>DETERGENT</span></div>
    </div>

    <script>
        (function() {
            // Ambil path yang diminta
            var requestedPath = window.location.pathname + window.location.search;
            
            // Tampilkan path di halaman
            var pathDisplay = document.getElementById('path-display');
            if (pathDisplay) {
                pathDisplay.textContent = 'Path: ' + requestedPath;
            }

            // Simpan path ke sessionStorage agar index.html bisa merender konten yang sesuai
            if (requestedPath && requestedPath !== '/' && requestedPath !== '/index.html' && requestedPath !== '/toko/') {
                try {
                    sessionStorage.setItem('albandar_redirect', requestedPath);
                } catch (e) {
                    // Session storage tidak tersedia - abaikan
                }
            }

            // Perbaiki link home
            var homeLink = document.getElementById('home-link');
            if (homeLink) {
                homeLink.href = '/toko/';
            }

            // Redirect ke /toko/index.html dengan path yang sama setelah delay
            setTimeout(function() {
                var redirectTarget = '/toko/index.html' + window.location.pathname + window.location.search;
                window.location.replace(redirectTarget);
            }, 1000);
        })();
    </script>
</body>
</html>
