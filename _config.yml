title: "Bandar Deterjen"
tagline: "Sahabat Usaha Anda"
description: "Sedia peralatan dan perlengkapan laundry terutama deterjen, parfum laundry, serta pelatihan sabun."
author: "Wahyudi"
email: "bandardeterjen@gmail.com"

# ====== PENTING: URL & BASEURL ======
url: "https://bandardeterjen.github.io"
baseurl: ""

# ---------- Build Settings ----------
markdown: kramdown
highlighter: rouge
permalink: /:categories/:title/
timezone: Asia/Jakarta

kramdown:
  input: GFM
  syntax_highlighter: rouge
  hard_wrap: false

# ---------- Pagination ----------
paginate: 6
paginate_path: "/page/:num/"

# ---------- Plugins ----------
plugins:
  - jekyll-paginate
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-redirect-from

# ---------- SEO Defaults ----------
lang: id_ID
logo: "https://raw.githubusercontent.com/bandardeterjen/index.html/refs/heads/images/apple-touch-icon.png"

twitter:
  username: bandardeterjen
  card: summary_large_image

social:
  name: Bandar Deterjen
  facebook: "https://facebook.com/bandardeterjen"
  instagram: "https://instagram.com/bandardeterjen"
  youtube: "https://youtube.com/bandardeterjen"
  linkedin: ""
  tiktok: ""
  telegram: "https://t.me/bandardeterjen"
  whatsapp: "https://wa.me/bandardeterjen"
  pinterest: ""
  reddit: ""
  discord: ""
  medium: ""
  devto: ""
  rss: "/feed.xml"                            # otomatis dari jekyll-feed

# ---------- Search ----------
search:
  enabled: true
  placeholder: "Cari artikel..."
  max_results: 10
  excerpt_length: 150

# ---------- Related Posts ----------
related:
  enabled: true
  count: 3
  strategy: categories   # options: categories, tags, both

# ---------- Defaults ----------
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      comments: true
      sitemap: true
  - scope:
      path: ""
    values:
      layout: "default"

# ---------- Exclude ----------
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - README.md
  - LICENSE
