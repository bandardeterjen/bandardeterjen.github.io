# ============================================
# Blogjak Theme Versi 3.0 — Konfigurasi Jekyll
# ============================================

title: "Bandar Deterjen"
tagline: "Sahabat Usaha Anda"
description: "Sedia peralatan dan perlengkapan laundry seperti deterjen, parfum laundry serta penyelenggara kursus sabun."
author: "Wahyudi"
email: "bandardeterjen.id@gmail.com"
version: "3.0.0"

# ====== URL & BASEURL ======
url: "https://bandardeterjen.github.io"
baseurl: ""

# ====== Build Settings ======
markdown: kramdown
highlighter: rouge
# PERUBAHAN v3.0: permalink tanpa tanggal & tag
permalink: /blog/:categories/:title/
timezone: Asia/Jakarta

kramdown:
  input: GFM
  syntax_highlighter: rouge
  hard_wrap: false

# ====== Pagination ======
paginate: 6
paginate_path: "/blog/page/:num/"

# ====== Plugins ======
plugins:
  - jekyll-paginate
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# ====== Language & SEO ======
lang: id_ID
logo: "/assets/images/logo.png"

twitter:
  username: blogjak
  card: summary_large_image

social:
  name: Bandar Deterjen
  links:
    - https://twitter.com/bandardeterjen

# ====== Search Engine Verification ======
google_site_verification: ""
bing_site_verification: ""
yandex_site_verification: ""

# ====== Search ======
search:
  enabled: true
  placeholder: "Cari artikel..."
  max_results: 10

# ====== Related Posts ======
related:
  enabled: true
  count: 3

# ====== Defaults ======
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      comments: true
      sitemap: true
  - scope:
      path: ""
    values:
      layout: "default"

# ====== Social Links (footer) ======
# PERUBAHAN v3.0: pindah dari `social:` ke `social_links:`
# Kosongkan ("") untuk menyembunyikan ikon
social_links:
  github: ""
  twitter: "https://twitter.com/bandardeterjen"
  facebook: "https://facebook.com/bandardeterjen"
  instagram: "https://instagram.com/bandardeterjen"
  youtube: "https://youtube.com/bandardeterjen"
  linkedin: ""
  tiktok: ""
  telegram: "https://t.me/bandardeterjen"
  whatsapp: "https://wa.me/bandardeterjen"
  pinterest: ""
  reddit: ""
  discord: ""
  medium: ""
  devto: ""

# ====== Exclude ======
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - README.md
  - LICENSE
