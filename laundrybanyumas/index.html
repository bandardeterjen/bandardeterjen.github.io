  <script>
    /* ================= DATA STATE ================= */
    let DATA_PRODUK = [];
    let DATA_PHONE = { primary: "081234567890", formatted: "0812-3456-7890" };
    let DATA_WILAYAH = [];
    let CART = [];
    
    // Konteks Wilayah Terpilih (Two-Way Persistence)
    let selectedDistrict = null;
    let selectedVillage = null;
    
    // Pagination State
    let currentPage = 1;
    const ITEMS_PER_PAGE = 6;
    const MAX_PAGES = 3;

    /* ================= PARSER CSV ASYNC ================= */
    function parseCSV(text) {
      const lines = text.trim().split('\n');
      if (lines.length < 2) return [];
      const headers = lines[0].split(',').map(h => h.trim().replace(/^["']|["']$/g, ''));
      return lines.slice(1).filter(l => l.trim().length > 0).map(line => {
        const values = [];
        let insideQuote = false;
        let entry = '';
        for (let i = 0; i < line.length; i++) {
          const char = line[i];
          if (char === '"' || char === "'") {
            insideQuote = !insideQuote;
          } else if (char === ',' && !insideQuote) {
            values.push(entry.trim().replace(/^["']|["']$/g, ''));
            entry = '';
          } else {
            entry += char;
          }
        }
        values.push(entry.trim().replace(/^["']|["']$/g, ''));
        
        const obj = {};
        headers.forEach((h, idx) => {
          obj[h] = values[idx] || '';
        });
        return obj;
      });
    }

    /* ================= FETCH DATA EKSTERNAL ================= */
    async function loadAllData() {
      try {
        // 1. Fetch Telepon
        const resPhone = await fetch('telepon.csv').catch(() => null);
        if (resPhone && resPhone.ok) {
          const textPhone = await resPhone.text();
          const rows = parseCSV(textPhone);
          if (rows.length > 0 && rows[0].nomor) {
            DATA_PHONE.primary = rows[0].nomor;
            DATA_PHONE.formatted = rows[0].format || rows[0].nomor;
          }
        }

        // 2. Fetch Wilayah
        const resWilayah = await fetch('wilayah.csv').catch(() => null);
        if (resWilayah && resWilayah.ok) {
          const textWilayah = await resWilayah.text();
          const rows = parseCSV(textWilayah);
          
          // Kelompokkan desa per kecamatan
          const grouped = {};
          rows.forEach(r => {
            const kec = r.kecamatan ? r.kecamatan.trim() : '';
            const kel = r.kelurahan ? r.kelurahan.trim() : '';
            if (kec) {
              if (!grouped[kec]) {
                grouped[kec] = {
                  nama: kec,
                  slug: slugify(kec),
                  kota: r.kota || 'Banyumas',
                  desa: []
                };
              }
              if (kel && !grouped[kec].desa.includes(kel)) {
                grouped[kec].desa.push(kel);
              }
            }
          });
          DATA_WILAYAH = Object.values(grouped);
        }

        // 3. Fetch Produk
        const resProduk = await fetch('produk.csv').catch(() => null);
        if (resProduk && resProduk.ok) {
          const textProduk = await resProduk.text();
          const rows = parseCSV(textProduk);
          DATA_PRODUK = rows.map((r, idx) => ({
            id: parseInt(r.id) || (idx + 1),
            slug: r.slug || slugify(r.title || `produk-${idx+1}`),
            title: r.title || 'Produk Tanpa Nama',
            price: parseInt(r.price) || 0,
            image: r.image || 'https://images.unsplash.com/photo-1583947215259-38e31be8751f?w=600&q=80',
            description: r.description || '',
            fitur: r.fitur ? r.fitur.split(';').map(f => f.trim()) : ['Kualitas Ekspor', 'Siap Kirim']
          }));
        }

      } catch (err) {
        console.warn('Gagal memuat beberapa file CSV, menggunakan fallback default jika tersedia.');
      }

      // Fallback Minimal jika CSV Wilayah belum ada di folder server
      if (DATA_WILAYAH.length === 0) {
        DATA_WILAYAH = [
          { nama: "Purwokerto Timur", slug: "purwokerto-timur", kota: "Banyumas", desa: ["Arcawinangun", "Kranji", "Mersi", "Purwokerto Lor", "Purwokerto Wetan", "Sokanegara"] },
          { nama: "Purwokerto Selatan", slug: "purwokerto-selatan", kota: "Banyumas", desa: ["Karangklesem", "Karangpucung", "Purwokerto Kulon", "Purwokerto Selatan", "Tanjung", "Teluk"] },
          { nama: "Purwokerto Barat", slug: "purwokerto-barat", kota: "Banyumas", desa: ["Bantarsoka", "Karanglewas Lor", "Kedungwuluh", "Kober", "Pasir Kidul", "Pasirmuncang", "Rejasari"] },
          { nama: "Purwokerto Utara", slug: "purwokerto-utara", kota: "Banyumas", desa: ["Bancarkembar", "Bobosan", "Grendeng", "Karangwangkal", "Pabuaran", "Sumampir"] },
          { nama: "Sumbang", slug: "sumbang", kota: "Banyumas", desa: ["Banjarsari Kulon", "Banjarsari Wetan", "Ciberem", "Datar", "Gandatapa", "Karangcegak", "Karanggintung", "Karangturi", "Kawungcarang", "Kebanggan", "Kedungmalang", "Kotayasa", "Limbangan", "Sikapat", "Silado", "Sumbang", "Susukan"] },
          { nama: "Baturraden", slug: "baturraden", kota: "Banyumas", desa: ["Karangmangu", "Karangtengah", "Kebumen", "Kemutug Kidul", "Kemutug Lor", "Ketenger", "Kutasari", "Pandak", "Purwosari", "Rempoah", "Rempoah Lor", "Pamijen"] },
          { nama: "Sokaraja", slug: "sokaraja", kota: "Banyumas", desa: ["Banjaranyar", "Banjarsari Kidul", "Jompo Kulon", "Kalikidang", "Karangduren", "Karangkedawung", "Karangnanas", "Karangrauk", "Klahang", "Lemberang", "Pamijen", "Sokaraja Kulon", "Sokaraja Lor", "Sokaraja Tengah", "Sokaraja Wetan", "Virgata"] },
          { nama: "Ajibarang", slug: "ajibarang", kota: "Banyumas", desa: ["Ajibarang Kulon", "Ajibarang Wetan", "Banjarsari", "Ciberung", "Darmakradenan", "Jingkang", "Kalibenda", "Karangbawang", "Kracak", "Lesmana", "Pancasan", "Pancurendang", "Sawangan", "Tipar Kidul", "Pandansari"] }
        ];
      }

      // Fallback Minimal jika CSV Produk belum ada
      if (DATA_PRODUK.length === 0) {
        DATA_PRODUK = [
          { id: 1, slug: "deterjen-liquid-premium", title: "Deterjen Cair Laundry Konsentrat 5L", price: 45000, image: "https://images.unsplash.com/photo-1583947215259-38e31be8751f?w=600&q=80", description: "Formula konsentrat tinggi ramah lingkungan, wangi segar tahan lama dan ampuh merontokkan noda membandel.", fitur: ["Anti Bakteri", "Busa Rendah (Aman Mesin)", "Ekonomis 5 Liter"] },
          { id: 2, slug: "parfum-laundry-grade-a", title: "Parfum Laundry Grade A Murni 5L", price: 125000, image: "https://images.unsplash.com/photo-1610557892470-55d9e80c0bce?w=600&q=80", description: "Bibit parfum import murni grade A tanpa endapan air, aroma tahan hingga 30 hari di dalam lemari.", fitur: ["Grade A Murni", "Aroma Segar Mewah", "Tahan 30 Hari"] },
          { id: 3, slug: "softener-pelembut-pakaian", title: "Softener & Pelicin Pakaian 5L", price: 50000, image: "https://images.unsplash.com/photo-1517677208171-0bc6725a3e60?w=600&q=80", description: "Melembutkan serat kain hingga ke pori terdalam, memudahkan proses setrika dan mencegah bau apek.", fitur: ["Serat Kain Lembut", "Mudah Disetrika", "Bebas Bau Apek"] },
          { id: 4, slug: "pembersih-kerak-porselen", title: "Pembersih Kerak Kamar Mandi & Porselen 1L", price: 35000, image: "https://images.unsplash.com/photo-1584820927498-cfe5211fd8bf?w=600&q=80", description: "Cairan formula aktif penghancur kerak membandel pada keramik dan kloset tanpa merusak lapisan glasir.", fitur: ["Bekerja Cepat", "Tanpa Bau Menyengat", "Kloset Berkilau"] },
          { id: 5, slug: "sabun-cuci-piring-jeruk-nipis", title: "Sabun Cuci Piring Jeruk Nipis Ekstrak 5L", price: 38000, image: "https://images.unsplash.com/photo-1585670270608-b4b0e872c3d1?w=600&q=80", description: "Mengandung ekstrak jeruk nipis asli pembasmi lemak membandel dan bau amis seketika, lembut di tangan.", fitur: ["Ekstrak Jeruk Nipis", "Lembut di Kulit", "Hemat & Busa Melimpah"] },
          { id: 6, slug: "karbol-wangi-sereh-pine", title: "Karbol Wangi Sereh & Pinus 5L", price: 42000, image: "https://images.unsplash.com/photo-1528740561666-dc2479dc08ab?w=600&q=80", description: "Disinfektan pembersih lantai alami dengan minyak sereh murni, mengusir serangga dan menyegarkan ruangan.", fitur: ["Minyak Sereh Murni", "Anti Kuman & Nyamuk", "Segar Alami"] }
        ];
      }

      renderFooterDistricts();
      handleHashRouting();
    }

    /* ================= HELPER FUNCTIONS ================= */
    function slugify(text) {
      return text.toString().toLowerCase().trim()
        .replace(/\s+/g, '-')
        .replace(/[^\w\-]+/g, '')
        .replace(/\-\-+/g, '-');
    }

    function formatRupiah(number) {
      return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(number);
    }

    /* ================= DYNAMIC SEO & OPENGRAPH ================= */
    function setDynamicSEO(title, desc, image) {
      document.title = title;
      
      const pt = document.getElementById('page-title'); if (pt) pt.innerText = title;
      const pd = document.getElementById('page-desc'); if (pd) pd.setAttribute("content", desc);
      
      const ot = document.getElementById('og-title'); if (ot) ot.setAttribute("content", title);
      const od = document.getElementById('og-desc'); if (od) od.setAttribute("content", desc);
      const ou = document.getElementById('og-url'); if (ou) ou.setAttribute("content", window.location.href);
      const oi = document.getElementById('og-image'); if (oi && image) oi.setAttribute("content", image);
      
      const tt = document.getElementById('tw-title'); if (tt) tt.setAttribute("content", title);
      const td = document.getElementById('tw-desc'); if (td) td.setAttribute("content", desc);
      const ti = document.getElementById('tw-image'); if (ti && image) ti.setAttribute("content", image);
    }

    /* ================= RENDER FOOTER WILAYAH ================= */
    function renderFooterDistricts() {
      const container = document.getElementById('footer-districts');
      if (!container) return;
      
      container.innerHTML = DATA_WILAYAH.map((d, index) => `
        <a href="#wilayah/${d.slug}" onclick="selectDistrictOnly('${d.slug}'); return false;" class="hover:text-brandOrange-400 transition font-medium">
          ${d.nama}${index < DATA_WILAYAH.length - 1 ? ' <span class="text-slate-600 ml-2">•</span>' : ''}
        </a>
      `).join('');
      
      const yr = document.getElementById('current-year');
      if (yr) yr.innerText = new Date().getFullYear();
    }

    /* ================= ROUTER & VIEW CONTROLLER ================= */
    function navigate(hash) {
      window.location.hash = hash;
    }

    window.addEventListener('hashchange', handleHashRouting);

    function handleHashRouting() {
      const hash = window.location.hash.replace(/^#/, '');
      const parts = hash.split('/').map(decodeURIComponent);
      const mainRoute = parts[0] || '';

      if (mainRoute === '' || mainRoute === 'beranda') {
        renderHomeView();
      } else if (mainRoute === 'produk-detail') {
        const productSlug = parts[1];
        const districtSlug = parts[2] || (selectedDistrict ? selectedDistrict.slug : null);
        const villageName = parts[3] || selectedVillage || null;

        const product = DATA_PRODUK.find(p => p.slug === productSlug) || DATA_PRODUK[0];
        const district = DATA_WILAYAH.find(d => d.slug === districtSlug) || selectedDistrict;

        if (district) selectedDistrict = district;
        if (villageName) selectedVillage = villageName;

        renderProductDetailView(product, district, villageName);
      } else if (mainRoute === 'wilayah') {
        const districtSlug = parts[1];
        const district = DATA_WILAYAH.find(d => d.slug === districtSlug) || DATA_WILAYAH[0];
        selectedDistrict = district;
        renderDistrictCatalogView(district);
      } else {
        renderHomeView();
      }
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function selectDistrictOnly(slug) {
      const d = DATA_WILAYAH.find(x => x.slug === slug);
      if (d) {
        selectedDistrict = d;
        selectedVillage = null;
        navigate(`wilayah/${d.slug}`);
      }
    }

    /* ================= VIEW 1: HOME CATALOG ================= */
    function renderHomeView() {
      setDynamicSEO(
        `${DATA_PHONE.formatted || DATA_PHONE.primary} Distributor Resmi Perlengkapan Kebersihan & Industri`,
        "Pusat belanja kebutuhan deterjen, pembersih, dan parfum laundry terpercaya. Pengiriman cepat langsung ke alamat Anda.",
        DATA_PRODUK[0]?.image || ""
      );

      const totalPages = Math.min(MAX_PAGES, Math.ceil(DATA_PRODUK.length / ITEMS_PER_PAGE)) || 1;
      if (currentPage > totalPages) currentPage = 1;

      const startIndex = (currentPage - 1) * ITEMS_PER_PAGE;
      const paginatedProducts = DATA_PRODUK.slice(startIndex, startIndex + ITEMS_PER_PAGE);

      const app = document.getElementById('app-root');
      app.innerHTML = `
        <div class="bg-gradient-to-r from-royal-900 via-royal-800 to-royal-900 text-white py-12 border-b border-royal-700">
          <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center space-y-3">
            <span class="bg-brandOrange-500/20 text-brandOrange-400 border border-brandOrange-500/30 text-xs px-3 py-1 rounded-full font-bold uppercase tracking-wider">
              Layanan Terpercaya & Pengiriman Langsung
            </span>
            <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight">Katalog Produk Pilihan Terbaik</h1>
            <p class="text-slate-300 text-sm sm:text-base max-w-2xl mx-auto">
              Solusi kebersihan dan kebutuhan kimia berkualitas standar industri. Siap antar ke alamat Anda dengan opsi pembayaran aman.
            </p>
          </div>
        </div>

        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            ${paginatedProducts.map(p => `
              <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm hover:shadow-md transition flex flex-col">
                <div class="h-56 bg-slate-100 overflow-hidden">
                  <img src="${p.image}" alt="${p.title}" class="w-full h-full object-cover hover:scale-105 transition duration-300">
                </div>
                <div class="p-5 flex flex-col flex-grow">
                  <h3 class="font-bold text-base text-slate-900 line-clamp-1 hover:text-royal-600 transition">
                    ${p.title}
                  </h3>
                  <div class="mt-2 text-xl font-black text-brandOrange-600">
                    ${formatRupiah(p.price)}
                  </div>
                  <p class="text-xs text-slate-500 mt-2 line-clamp-2 leading-relaxed flex-grow">
                    ${p.description}
                  </p>
                  
                  <div class="mt-5 grid grid-cols-2 gap-2 pt-3 border-t border-slate-100">
                    <button onclick="goToProductDetail('${p.slug}')" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold py-2.5 rounded-xl transition text-center">
                      Detail Produk
                    </button>
                    <button onclick="addToCart(${p.id})" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold py-2.5 rounded-xl transition flex items-center justify-center gap-1.5 shadow-sm">
                      <i class="fa-solid fa-cart-plus"></i> + Keranjang
                    </button>
                  </div>
                </div>
              </div>
            `).join('')}
          </div>

          <div class="mt-12 flex items-center justify-center gap-1.5">
            <button onclick="changePage(1)" ${currentPage === 1 ? 'disabled class="opacity-40 cursor-not-allowed px-3 py-2 border rounded-lg text-xs font-bold text-slate-500 bg-white"' : 'class="px-3 py-2 border rounded-lg text-xs font-bold text-royal-800 bg-white hover:bg-royal-50 border-slate-300"'}>
              «
            </button>
            <button onclick="changePage(${currentPage - 1})" ${currentPage === 1 ? 'disabled class="opacity-40 cursor-not-allowed px-3 py-2 border rounded-lg text-xs font-bold text-slate-500 bg-white"' : 'class="px-3 py-2 border rounded-lg text-xs font-bold text-royal-800 bg-white hover:bg-royal-50 border-slate-300"'}>
              ‹
            </button>
            
            ${Array.from({ length: totalPages }, (_, i) => i + 1).map(num => `
              <button onclick="changePage(${num})" class="px-3.5 py-2 border rounded-lg text-xs font-bold transition ${currentPage === num ? 'bg-royal-800 text-white border-royal-800 shadow' : 'bg-white text-slate-700 hover:bg-royal-50 border-slate-300'}">
                ${num}
              </button>
            `).join('')}

            <button onclick="changePage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled class="opacity-40 cursor-not-allowed px-3 py-2 border rounded-lg text-xs font-bold text-slate-500 bg-white"' : 'class="px-3 py-2 border rounded-lg text-xs font-bold text-royal-800 bg-white hover:bg-royal-50 border-slate-300"'}>
              ›
            </button>
            <button onclick="changePage(${totalPages})" ${currentPage === totalPages ? 'disabled class="opacity-40 cursor-not-allowed px-3 py-2 border rounded-lg text-xs font-bold text-slate-500 bg-white"' : 'class="px-3 py-2 border rounded-lg text-xs font-bold text-royal-800 bg-white hover:bg-royal-50 border-slate-300"'}>

            </button>
          </div>
        </div>
      `;
    }

    function changePage(page) {
      const totalPages = Math.min(MAX_PAGES, Math.ceil(DATA_PRODUK.length / ITEMS_PER_PAGE)) || 1;
      if (page >= 1 && page <= totalPages) {
        currentPage = page;
        renderHomeView();
        window.scrollTo({ top: 300, behavior: 'smooth' });
      }
    }

    function goToProductDetail(slug) {
      if (selectedDistrict && selectedVillage) {
        navigate(`produk-detail/${slug}/${selectedDistrict.slug}/${encodeURIComponent(selectedVillage)}`);
      } else if (selectedDistrict) {
        navigate(`produk-detail/${slug}/${selectedDistrict.slug}`);
      } else {
        navigate(`produk-detail/${slug}`);
      }
    }
