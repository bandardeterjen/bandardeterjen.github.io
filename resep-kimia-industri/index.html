<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Katalog Resep & Akses Member</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #cbd5e1; }
        #sidebar { transition: width 0.3s ease-in-out; }
        .sidebar-closed #sidebar { width: 0; overflow: hidden; border-right-width: 0; }
        #toggle-icon { transform: rotate(180deg); transition: transform 0.3s; }
        .sidebar-closed #toggle-icon { transform: rotate(0deg); }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">

    <!-- ================= HALAMAN LOGIN ================= -->
    <div id="login-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-md flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-3xl p-6 md:p-8 max-w-md w-full shadow-2xl border border-slate-100">
            <div class="text-center mb-6">
                <div class="bg-indigo-600 w-12 h-12 rounded-2xl flex items-center justify-center text-white mx-auto mb-3 shadow-lg shadow-indigo-200">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
                </div>
                <h2 class="text-2xl font-bold text-slate-800">Verifikasi Akses</h2>
                <p class="text-xs text-slate-500 mt-1">Masukkan email terdaftar & selesaikan tantangan matematika.</p>
            </div>

            <form id="login-form" onsubmit="handleLoginSubmit(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Alamat Email</label>
                    <input type="email" id="login-email" required placeholder="nama@email.com" class="w-full px-4 py-2.5 bg-slate-50 rounded-xl text-sm border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Verifikasi Matematika</label>
                    <div class="flex items-center gap-2">
                        <div id="math-question" class="bg-indigo-50 text-indigo-700 px-4 py-2 rounded-xl text-sm font-bold border border-indigo-100 shrink-0">
                            <!-- Pertanyaan Matematika Generated via JS -->
                        </div>
                        <input type="number" id="math-answer" required placeholder="Hasil?" class="w-full px-4 py-2.5 bg-slate-50 rounded-xl text-sm border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                </div>

                <div id="login-error" class="hidden text-xs text-red-500 bg-red-50 p-3 rounded-xl border border-red-100 font-medium"></div>

                <button type="submit" id="btn-login" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-semibold text-sm transition-all shadow-md shadow-indigo-200 flex items-center justify-center gap-2">
                    <span>Masuk / Verifikasi</span>
                </button>
            </form>
        </div>
    </div>

    <!-- ================= MODAL PANEL ADMIN (MANAJEMEN EMAIL) ================= -->
    <div id="admin-modal" class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4 z-40">
        <div class="bg-white rounded-3xl p-6 max-w-lg w-full shadow-2xl border border-slate-100 flex flex-col max-h-[85vh]">
            <div class="flex justify-between items-center pb-4 border-b border-slate-100">
                <h3 class="font-bold text-slate-800 text-lg">Panel Admin - Kelola Email Member</h3>
                <button onclick="closeAdminPanel()" class="text-slate-400 hover:text-slate-600 text-xl font-bold">&times;</button>
            </div>

            <div class="mt-4 flex gap-2">
                <input type="email" id="new-user-email" placeholder="Tambah email baru..." class="flex-1 px-4 py-2 bg-slate-100 rounded-xl text-sm border-none focus:ring-2 focus:ring-indigo-500 outline-none">
                <button onclick="addNewUser()" class="px-4 py-2 bg-indigo-600 text-white rounded-xl text-sm font-semibold hover:bg-indigo-700">Tambah</button>
            </div>

            <div id="admin-user-list" class="mt-4 flex-1 overflow-y-auto space-y-2 custom-scrollbar pr-1">
                <!-- User list loaded dynamically -->
            </div>
        </div>
    </div>

    <!-- ================= HALAMAN UTAMA (KATALOG) ================= -->
    <div id="app" class="flex h-screen overflow-hidden hidden">
        <!-- Sidebar -->
        <aside id="sidebar" class="w-80 bg-white border-r border-slate-200 flex flex-col shrink-0">
            <div class="p-4 border-b border-slate-100 bg-white sticky top-0 z-10">
                <div class="flex items-center justify-between mb-4">
                    <div class="flex items-center gap-3">
                        <div class="bg-indigo-600 p-2 rounded-lg text-white">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
                        </div>
                        <h1 class="font-bold text-lg text-slate-800 tracking-tight">E-Katalog Resep</h1>
                    </div>
                </div>
                <div class="relative">
                    <input type="text" id="search-input" placeholder="Cari resep..." class="w-full pl-4 pr-4 py-2 bg-slate-100 rounded-xl text-sm border-none focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
            </div>
            <div id="recipe-list" class="flex-1 overflow-y-auto py-2 custom-scrollbar"></div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 flex flex-col min-w-0 relative">
            <header class="bg-white/80 backdrop-blur-md border-b border-slate-200 px-6 py-4 flex items-center justify-between sticky top-0 z-20">
                <button id="sidebar-toggle" class="p-2 hover:bg-slate-100 rounded-lg text-slate-500">
                    <svg id="toggle-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
                </button>
                <div class="flex items-center gap-3">
                    <span id="user-display" class="text-xs font-semibold text-slate-500 bg-slate-100 px-3 py-1.5 rounded-lg"></span>
                    <button id="btn-admin-panel" onclick="openAdminPanel()" class="hidden text-xs bg-indigo-600 text-white font-semibold px-3 py-1.5 rounded-lg hover:bg-indigo-700">Kelola Email</button>
                    <button onclick="logout()" class="text-xs bg-red-50 text-red-600 font-semibold px-3 py-1.5 rounded-lg hover:bg-red-100">Keluar</button>
                </div>
            </header>

            <div id="content-area" class="flex-1 overflow-y-auto p-6 md:p-10 scroll-smooth">
                <div id="recipe-container" class="max-w-3xl mx-auto"></div>
            </div>
        </main>
    </div>
